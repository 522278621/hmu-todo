<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="禾木待办">
  <meta name="theme-color" content="#F5F0E8">
  <meta name="format-detection" content="telephone=no">
  <title>禾木纸管待办事项</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #F5F0E8;
      --card: #FFFFFF;
      --card-done: #EDE9E0;
      --text: #3C3C3C;
      --text-light: #9A9A9A;
      --text-done: #BCB9B0;
      --border: #E2DDD3;
      --accent: #8B7355;
      --accent-light: #A89279;
      --danger: #C9786E;
      --shadow: 0 1px 4px rgba(60, 50, 40, 0.06);
      --radius: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html {
      height: 100%;
    }

    html, body {
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      padding-top: var(--safe-top);
    }

    /* ── 顶部标题栏 ── */
    .header {
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .header .count {
      font-size: 13px;
      color: var(--text-light);
      background: var(--card);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* ── 列表区域 ── */
    .list-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 14px;
      padding-bottom: 80px;
    }

    .list-wrap::-webkit-scrollbar {
      display: none;
    }

    /* ── 空状态 ── */
    .empty {
      text-align: center;
      padding: 100px 20px 0;
      color: var(--text-light);
    }

    .empty .icon {
      font-size: 52px;
      margin-bottom: 20px;
      opacity: 0.25;
    }

    .empty p {
      font-size: 14px;
      line-height: 2;
    }

    /* ── 待办卡片 ── */
    .todo-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: opacity 0.2s ease, transform 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .todo-card.done {
      background: var(--card-done);
      opacity: 0.65;
    }

    .todo-card.removing {
      opacity: 0;
      transform: translateX(80px);
    }

    /* 勾选框 - 44px 触摸区域 */
    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .checkbox::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
    }

    .checkbox.checked {
      border-color: var(--accent);
      background: var(--accent);
    }

    .checkbox.checked::after {
      content: '✓';
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    /* 内容 */
    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    .todo-card.done .todo-text {
      color: var(--text-done);
      text-decoration: line-through;
    }

    .todo-time {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 3px;
    }

    /* 删除按钮 */
    .btn-delete {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      color: #CCC;
      font-size: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.15s;
      opacity: 0.4;
    }

    .btn-delete:active {
      color: var(--danger);
      opacity: 1;
      background: rgba(201, 120, 110, 0.08);
    }

    /* ── 清理已完成 ── */
    .clear-bar {
      text-align: center;
      padding: 4px 0 10px;
      flex-shrink: 0;
    }

    .btn-clear {
      background: var(--card);
      border: none;
      color: var(--text-light);
      font-size: 13px;
      cursor: pointer;
      padding: 8px 18px;
      border-radius: 16px;
      font-family: var(--font);
      box-shadow: var(--shadow);
      transition: all 0.15s;
    }

    .btn-clear:active {
      opacity: 0.7;
    }

    /* ── 历史记录 ── */
    .history-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 20px 4px;
      flex-shrink: 0;
      cursor: pointer;
      color: var(--text-light);
      font-size: 13px;
      font-family: var(--font);
      background: none;
      border: none;
      width: 100%;
      text-align: left;
    }

    .history-toggle .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 9px;
    }

    .history-toggle.open .arrow {
      transform: rotate(90deg);
    }

    .history-panel {
      display: none;
      padding: 2px 14px 8px;
      flex-shrink: 0;
    }

    .history-panel.open {
      display: block;
    }

    .history-list {
      max-height: 35vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .history-item {
      background: var(--card-done);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item .todo-content {
      flex: 1;
      min-width: 0;
    }

    .history-item .todo-text {
      color: var(--text-done);
      text-decoration: line-through;
      font-size: 14px;
    }

    .history-item .todo-time {
      font-size: 11px;
      color: var(--text-light);
    }

    .btn-restore {
      background: none;
      border: 1px solid var(--accent-light);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .btn-restore:active {
      background: var(--accent);
      color: #fff;
    }

    .btn-perm-delete {
      background: none;
      border: none;
      color: #CCC;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
      opacity: 0.5;
    }

    .btn-perm-delete:active {
      color: var(--danger);
      opacity: 1;
    }

    .history-empty {
      text-align: center;
      padding: 16px;
      color: var(--text-light);
      font-size: 13px;
    }

    .history-actions {
      text-align: center;
      padding: 6px 0;
    }

    .btn-clear-history {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 12px;
      cursor: pointer;
      padding: 6px 14px;
      font-family: var(--font);
    }

    .btn-clear-history:active {
      color: var(--danger);
    }

    /* ── 底部输入栏 ── */
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 14px;
      padding-bottom: calc(8px + var(--safe-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }

    .input-bar input {
      flex: 1;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 16px;
      font-size: 16px;
      font-family: var(--font);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .input-bar input:focus {
      border-color: var(--accent);
    }

    .input-bar input::placeholder {
      color: var(--text-light);
    }

    .btn-add {
      height: 46px;
      padding: 0 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-family: var(--font);
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .btn-add:active {
      opacity: 0.75;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: calc(70px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 60, 60, 0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .toast.show {
      opacity: 1;
    }

    /* ── 桌面端居中限制（768px 以上才触发） ── */
    @media (min-width: 768px) {
      body {
        max-width: 500px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        min-height: 100dvh;
        box-shadow: 0 0 40px rgba(0,0,0,0.04);
      }

      .input-bar {
        max-width: 500px;
        left: 50%;
        transform: translateX(-50%);
      }

      .btn-delete {
        opacity: 0.3;
      }

      .todo-card:hover .btn-delete {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>禾木纸管待办事项</h1>
    <span class="count" id="countLabel">0 项</span>
  </div>

  <div class="list-wrap" id="listWrap">
    <div class="empty" id="emptyState">
      <div class="icon">📋</div>
      <p>暂无待办事项<br>在下方添加一条吧</p>
    </div>
  </div>

  <div class="clear-bar" id="clearBar" style="display:none;">
    <button class="btn-clear" onclick="clearDone()">归档已完成</button>
  </div>

  <button class="history-toggle" id="historyToggle" onclick="toggleHistory()">
    <span class="arrow">▶</span> 历史记录 <span id="historyBadge" style="display:none">(0)</span>
  </button>

  <div class="history-panel" id="historyPanel">
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无历史记录</div>
    </div>
    <div class="history-actions" id="historyActions" style="display:none">
      <button class="btn-clear-history" onclick="clearAllHistory()">清空全部历史</button>
    </div>
  </div>

  <div class="input-bar">
    <input
      type="text"
      id="inputBox"
      placeholder="输入待办事项..."
      maxlength="200"
      autocomplete="off"
      enterkeyhint="done"
    >
    <button class="btn-add" onclick="addTodo()">添加</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_TODOS = 'simple_todos';
    const STORAGE_HISTORY = 'simple_todos_history';
    let todos = [];
    let history = [];

    function loadData() {
      try {
        todos = JSON.parse(localStorage.getItem(STORAGE_TODOS)) || [];
        history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
      } catch (e) {
        todos = [];
        history = [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_TODOS, JSON.stringify(todos));
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const wrap = document.getElementById('listWrap');
      const empty = document.getElementById('emptyState');
      const clearBar = document.getElementById('clearBar');
      const countLabel = document.getElementById('countLabel');

      const active = todos.filter(t => !t.done);
      const done = todos.filter(t => t.done);

      countLabel.textContent = active.length + ' 项';

      const cards = wrap.querySelectorAll('.todo-card');
      cards.forEach(c => c.remove());

      if (todos.length === 0) {
        empty.style.display = '';
        clearBar.style.display = 'none';
      } else {
        empty.style.display = 'none';
        clearBar.style.display = done.length > 0 ? '' : 'none';

        const ordered = [...active, ...done];
        ordered.forEach((todo) => {
          const card = document.createElement('div');
          card.className = 'todo-card' + (todo.done ? ' done' : '');
          card.dataset.id = todo.id;

          card.innerHTML = `
            <div class="checkbox ${todo.done ? 'checked' : ''}" onclick="toggleDone(${todo.id})"></div>
            <div class="todo-content">
              <div class="todo-text">${escapeHtml(todo.text)}</div>
              <div class="todo-time">${formatTime(todo.createdAt)}</div>
            </div>
            <button class="btn-delete" onclick="deleteTodo(${todo.id})" title="删除">\u00d7</button>
          `;

          wrap.appendChild(card);
        });
      }

      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const actions = document.getElementById('historyActions');
      const badge = document.getElementById('historyBadge');

      list.innerHTML = '';
      badge.style.display = history.length > 0 ? '' : 'none';
      badge.textContent = '(' + history.length + ')';
      actions.style.display = history.length > 0 ? '' : 'none';

      if (history.length === 0) {
        list.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        return;
      }

      const reversed = [...history].reverse();
      reversed.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.dataset.hid = item.id;

        const actionLabel = item.source === 'deleted' ? '已删除' : '已完成';
        const timeLabel = item.source === 'deleted'
          ? formatTime(item.deletedAt)
          : formatTime(item.doneAt);

        div.innerHTML = `
          <div class="todo-content">
            <div class="todo-text">${escapeHtml(item.text)}</div>
            <div class="todo-time">${actionLabel} \u00b7 ${timeLabel}</div>
          </div>
          <button class="btn-restore" onclick="restoreFromHistory(${item.id})">还原</button>
          <button class="btn-perm-delete" onclick="permanentDelete(${item.id})" title="彻底删除">\u00d7</button>
        `;

        list.appendChild(div);
      });
    }

    function addTodo() {
      const input = document.getElementById('inputBox');
      const text = input.value.trim();
      if (!text) return;

      todos.unshift({
        id: Date.now(),
        text,
        done: false,
        createdAt: Date.now()
      });

      saveTodos();
      render();
      input.value = '';
      input.focus();
      showToast('已添加');
    }

    function toggleDone(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      todo.done = !todo.done;
      saveTodos();
      render();

      showToast(todo.done ? '已标记完成' : '已取消完成');
    }

    function deleteTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      const card = document.querySelector('.todo-card[data-id="' + id + '"]');
      if (card) {
        card.classList.add('removing');
        setTimeout(() => moveToHistory(todo, 'deleted'), 200);
      } else {
        moveToHistory(todo, 'deleted');
      }
    }

    function clearDone() {
      const doneItems = todos.filter(t => t.done);
      if (doneItems.length === 0) return;

      doneItems.forEach(t => moveToHistoryItem(t, 'done'));
      todos = todos.filter(t => !t.done);
      saveTodos();
      saveHistory();
      render();
      showToast('已归档 ' + doneItems.length + ' 项到历史记录');
    }

    function moveToHistory(todo, source) {
      moveToHistoryItem(todo, source);
      todos = todos.filter(t => t.id !== todo.id);
      saveTodos();
      saveHistory();
      render();
      if (source === 'deleted') showToast('已移入历史记录');
    }

    function moveToHistoryItem(todo, source) {
      history.push({
        id: todo.id,
        text: todo.text,
        source: source,
        doneAt: source === 'done' ? Date.now() : null,
        deletedAt: source === 'deleted' ? Date.now() : null,
        createdAt: todo.createdAt
      });
    }

    function restoreFromHistory(hid) {
      const item = history.find(h => h.id === hid);
      if (!item) return;

      todos.unshift({
        id: item.id,
        text: item.text,
        done: false,
        createdAt: item.createdAt || Date.now()
      });

      history = history.filter(h => h.id !== hid);
      saveTodos();
      saveHistory();
      render();
      showToast('已还原');
    }

    function permanentDelete(hid) {
      if (!confirm('确定要彻底删除这条记录吗？删除后无法恢复。')) return;
      history = history.filter(h => h.id !== hid);
      saveHistory();
      render();
      showToast('已彻底删除');
    }

    function clearAllHistory() {
      if (history.length === 0) return;
      if (!confirm('确定要清空全部 ' + history.length + ' 条历史记录吗？此操作不可恢复。')) return;
      history = [];
      saveHistory();
      render();
      showToast('历史记录已清空');
    }

    function toggleHistory() {
      document.getElementById('historyPanel').classList.toggle('open');
      document.getElementById('historyToggle').classList.toggle('open');
    }

    document.getElementById('inputBox').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTodo();
    });

    // 阻止双击缩放
    let lastTouch = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouch < 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });

    loadData();
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
